<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#060B1C">
<title>Offline | Codexas</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:24px;background:#060B1C;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;text-align:center}
  img{width:72px;height:72px}
  h1{margin:0;font-size:clamp(28px,6vw,44px);letter-spacing:-0.02em;text-transform:uppercase;font-weight:500;line-height:1}
  p{margin:0;max-width:380px;color:#B4BEDA;line-height:1.6}
  button{min-height:48px;padding:0 28px;border:0;border-radius:999px;background:#2447E0;color:#fff;font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
</style>
</head>
<body>
  <img src="/logo-mark.webp" alt="" width="72" height="72">
  <h1>Anda sedang offline</h1>
  <p>Koneksi internet terputus. Periksa jaringan Anda lalu coba muat ulang halaman.</p>
  <button type="button" onclick="location.reload()">Muat ulang</button>
</body>
</html>
